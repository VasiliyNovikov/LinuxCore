name: "Copilot Setup Steps"

# This workflow configures the environment for GitHub Copilot Agent with gh-aw MCP server
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest

    # Set minimal permissions for setup steps
    # Copilot Agent receives its own token with appropriate permissions
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang linux-libc-dev zlib1g-dev

      - name: Restore dependencies
        run: dotnet restore

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: docker.io/tonistiigi/binfmt:latest
          platforms: arm64,arm,ppc64le,s390x,riscv64

      - name: Set up LoongArch64 QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ghcr.io/loong64/tonistiigi/binfmt:master
          platforms: loong64

      - name: Verify development tools
        shell: bash
        run: |
          set -euo pipefail
          docker --version
          gh --version

          for emulator in qemu-aarch64 qemu-arm qemu-ppc64le qemu-s390x qemu-riscv64 qemu-loongarch64; do
            status="/proc/sys/fs/binfmt_misc/$emulator"
            test -r "$status"
            grep -qx enabled "$status"
          done

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@main
        with:
          version: v0.86.2