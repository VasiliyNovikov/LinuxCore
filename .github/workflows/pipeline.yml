name: Validate & Publish
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    strategy:
      matrix:
        include:
          - name: ubuntu-24.04-x64
            os: ubuntu-24.04
          - name: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
          - name: ubuntu-22.04-x64
            os: ubuntu-22.04
          - name: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
          - name: alpine-x64
            os: ubuntu-latest
            container: mcr.microsoft.com/dotnet/sdk:10.0-alpine
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        if: ${{ !matrix.container }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-alpine-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Build & Test
        run: >
          docker run --rm
          -v "${{ github.workspace }}:/src"
          -w /src
          mcr.microsoft.com/dotnet/sdk:10.0-alpine
          sh -c "dotnet build && dotnet test --no-build"

  publish:
    if: ${{ success() && (vars.PUBLISH == 'true' || vars.PUBLISH == 'auto' && github.ref_name == 'master') }}
    needs:
      - validate
      - validate-alpine-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Package Version
        id: package_version
        run: |
          version=$(dotnet run ./.github/workflows/PackageVersion.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack ./LinuxCore/LinuxCore.csproj -c Release --no-build -p:Version=${{ steps.package_version.outputs.version }}

      - name: Push
        run: dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
