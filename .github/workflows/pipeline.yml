name: Validate & Publish
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04-x64
            os: ubuntu-26.04
            architecture: x64
          - name: ubuntu-26.04-arm64
            os: ubuntu-26.04-arm
            architecture: arm64
          - name: ubuntu-24.04-x64
            os: ubuntu-24.04
            architecture: x64
          - name: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            architecture: arm64
          - name: ubuntu-22.04-x64
            os: ubuntu-22.04
            architecture: x64
          - name: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang linux-libc-dev zlib1g-dev

      - name: Build & Test
        env:
          LINUXCORE_EXPECTED_QEMU_LINUX_USER: false
          LINUXCORE_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION: glibc
        run: |
          dotnet build
          dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true

      - name: NativeAOT Smoke
        run: |
          dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r "linux-${{ matrix.architecture }}" -p:PublishAot=true -o "artifacts/aot-smoke/${{ matrix.name }}"
          "./artifacts/aot-smoke/${{ matrix.name }}/LinuxCore.AotSmokeTest"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-containerized-architectures:
    name: validate-containerized-architectures (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-musl
            os: ubuntu-latest
            platform: linux/amd64
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: x64
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-x64
          - name: arm64-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: arm64
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-arm64
          - name: arm32-glibc
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-resolute
            architecture: arm
            libc-implementation: glibc
            setup: apt-get update && apt-get install -y --no-install-recommends clang gcc libc6-dev linux-libc-dev zlib1g-dev
            aot-runtime: linux-arm
          - name: arm32-musl
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: arm
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "${{ github.workspace }}:/src" -w /src \
            -e LINUXCORE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=false \
            -e LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION=${{ matrix.libc-implementation }} \
            "${{ matrix.image }}" /bin/sh -lc '
            set -eu
            ${{ matrix.setup }}

            dotnet build
            dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true
            dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r ${{ matrix.aot-runtime }} -p:PublishAot=true -o /tmp/aot-smoke
            /tmp/aot-smoke/LinuxCore.AotSmokeTest
          '

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-emulated-architectures:
    name: validate-emulated-architectures (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppc64le-glibc
            image: registry.access.redhat.com/dotnet/sdk:10.0
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: ppc64le
            setup: microdnf install -y binutils gcc glibc-devel kernel-headers
          - name: s390x-glibc
            image: registry.access.redhat.com/dotnet/sdk:10.0
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: s390x
            setup: microdnf install -y binutils gcc glibc-devel kernel-headers
          - name: riscv64-glibc
            image: debian:stable-slim
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: riscv64
            setup: /bin/bash /src/.github/workflows/install-community-dotnet.sh filipnavara/dotnet-riscv riscv64
          - name: loongarch64-glibc
            image: ghcr.io/loong64/debian:trixie-slim
            binfmt-image: ghcr.io/loong64/tonistiigi/binfmt:master
            architecture: loong64
            setup: /bin/bash /src/.github/workflows/install-community-dotnet.sh loongson/dotnet loongarch64
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build and discover portable tests on host
        id: portable_tests
        run: |
          set -euo pipefail
          dotnet build LinuxCore.Tests/LinuxCore.Tests.csproj -p:BuildPortableMtpRunner=true
          discovery_output=$(dotnet LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --list-tests --no-banner --no-ansi --progress off)
          printf '%s\n' "$discovery_output"
          if [[ "$discovery_output" =~ Test\ discovery\ summary:\ found\ ([1-9][0-9]*)\ test\(s\) ]]; then
            printf 'count=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ${{ matrix.binfmt-image }}
          platforms: ${{ matrix.architecture }}

      - name: Build & Test
        run: |
          docker run --rm --platform "linux/${{ matrix.architecture }}" --user 0 \
            -v "${{ github.workspace }}:/src" -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e LINUXCORE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=true \
            -e LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION=glibc \
            "${{ matrix.image }}" /bin/bash -lc '
            set -eu
            ${{ matrix.setup }}

            elf_data=$(LC_ALL=C readelf -h /bin/bash | grep "^  Data:")
            case "$elf_data" in
              *"big endian"*)
                # The MTP 2.3.3 streaming TRX reader assumes native endianness and emits empty reports on big-endian targets.
                dotnet test /src/LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --logger trx --results-directory "/src/TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true
                ;;
              *"little endian"*)
                dotnet /src/LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --report-trx --results-directory "/src/TestResults-${{ matrix.name }}" --no-banner
                ;;
              *)
                printf "Unsupported ELF data encoding: %s\n" "$elf_data" >&2
                exit 1
                ;;
            esac
          '

      - name: Validate Test Results
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "TestResults-${{ matrix.name }}" -Filter *.trx)
          if ($files.Count -ne 1) { throw "Expected exactly one TRX, found $($files.Count)" }

          [xml]$trx = Get-Content $files[0] -Raw
          $actual = [int]$trx.TestRun.ResultSummary.Counters.total
          $expected = ${{ steps.portable_tests.outputs.count }}
          if ($actual -ne $expected) { throw "Expected $expected tests, TRX reported $actual" }

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  publish:
    if: ${{ success() && (vars.PUBLISH == 'true' || vars.PUBLISH == 'auto' && github.ref_name == 'master') }}
    needs:
      - validate
      - validate-containerized-architectures
      - validate-emulated-architectures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Package Version
        id: package_version
        run: |
          version=$(dotnet run ./.github/workflows/PackageVersion.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack ./LinuxCore/LinuxCore.csproj -c Release --no-build -p:Version=${{ steps.package_version.outputs.version }}

      - name: Push
        run: |
          dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push **/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
