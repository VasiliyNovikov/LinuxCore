name: Validate & Publish
permissions:
  contents: read
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04-x64
            os: ubuntu-26.04
            aot_runtime: linux-x64
          - name: ubuntu-26.04-arm64
            os: ubuntu-26.04-arm
            aot_runtime: linux-arm64
          - name: ubuntu-24.04-x64
            os: ubuntu-24.04
            aot_runtime: linux-x64
          - name: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            aot_runtime: linux-arm64
          - name: ubuntu-22.04-x64
            os: ubuntu-22.04
            aot_runtime: linux-x64
          - name: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            aot_runtime: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang linux-libc-dev zlib1g-dev

      - name: Build & Test
        env:
          LINUXCORE_EXPECTED_QEMU_LINUX_USER: false
        run: |
          dotnet build
          dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}"

      - name: NativeAOT Smoke
        run: |
          dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r ${{ matrix.aot_runtime }} -p:PublishAot=true -o "artifacts/aot-smoke/${{ matrix.name }}"
          "./artifacts/aot-smoke/${{ matrix.name }}/LinuxCore.AotSmokeTest"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-alpine:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: alpine-x64
            os: ubuntu-latest
            aot_runtime: linux-musl-x64
          - name: alpine-arm64
            os: ubuntu-24.04-arm
            aot_runtime: linux-musl-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test
        run: >
          docker run --rm --privileged -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=false -v "${{ github.workspace }}:/src" -w /src mcr.microsoft.com/dotnet/sdk:10.0-alpine
          sh -c "apk add --no-cache build-base clang linux-headers zlib-dev &&
          dotnet build &&
          dotnet test --no-build --logger trx --results-directory TestResults-${{ matrix.name }} &&
          dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r ${{ matrix.aot_runtime }} -p:PublishAot=true -o /tmp/aot-smoke &&
          /tmp/aot-smoke/LinuxCore.AotSmokeTest"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-emulated-architectures:
    name: validate-emulated-architectures (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm32-glibc
            os: ubuntu-24.04-arm
            use_qemu: false
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-resolute
            shell: /bin/bash
            architecture: Arm
            pointer_size: 4
            libc_pattern: GLIBC|GNU libc
            setup: apt-get update && apt-get install -y --no-install-recommends clang gcc libc6-dev linux-libc-dev zlib1g-dev
            memlock: 65536
            aot_runtime: linux-arm
          - name: arm32-musl
            os: ubuntu-24.04-arm
            use_qemu: false
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            shell: /bin/sh
            architecture: Arm
            pointer_size: 4
            libc_pattern: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            memlock: 65536
            aot_runtime: linux-musl-arm
          - name: ppc64le-glibc
            os: ubuntu-24.04
            use_qemu: true
            platform: linux/ppc64le
            qemu_platform: ppc64le
            image: registry.access.redhat.com/dotnet/sdk:10.0
            shell: /bin/bash
            architecture: Ppc64le
            pointer_size: 8
            libc_pattern: GLIBC|GNU libc
            setup: microdnf install -y gcc glibc-devel kernel-headers
            memlock: 0
          - name: riscv64
            os: ubuntu-24.04
            use_qemu: true
            platform: linux/riscv64
            qemu_platform: riscv64
            image: debian:stable-slim
            shell: /bin/bash
            architecture: RiscV64
            pointer_size: 8
            libc_pattern: GLIBC|GNU libc
            setup: |
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl gcc coreutils libc-bin libc6-dev libgcc-s1 libgssapi-krb5-2 libicu76 libssl3t64 libstdc++6 libunwind8 linux-libc-dev tzdata zlib1g
              sdk_archive=/tmp/dotnet-sdk-10.0.109-linux-riscv64.tar.gz
              curl --fail --location --retry 5 --output "$sdk_archive" https://github.com/filipnavara/dotnet-riscv/releases/download/10.0.109/dotnet-sdk-10.0.109-linux-riscv64.tar.gz
              printf "%s  %s\n" e003c23007b0d69933b206be0ea9be46438a34896f14a1886d6eec1d7b5f2057 "$sdk_archive" | sha256sum --check
              mkdir -p /usr/share/dotnet
              tar -xzf "$sdk_archive" -C /usr/share/dotnet
              ln -s /usr/share/dotnet/dotnet /usr/bin/dotnet
            memlock: 65536
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build and discover portable tests on host
        id: portable_tests
        shell: bash
        env:
          DOTNET_CLI_UI_LANGUAGE: en
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          dotnet build LinuxCore.Tests/LinuxCore.Tests.csproj -p:BuildPortableMtpRunner=true
          test_dll="LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll"
          discovery_output=$(dotnet "$test_dll" --list-tests --no-banner --no-ansi --no-progress)
          printf '%s\n' "$discovery_output"
          if [[ "$discovery_output" =~ Test\ discovery\ summary:\ found\ ([1-9][0-9]*)\ test\(s\) ]]; then
            printf 'count=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Set up QEMU
        if: ${{ matrix.use_qemu }}
        uses: docker/setup-qemu-action@v4
        with:
          platforms: ${{ matrix.qemu_platform }}
          cache-image: false

      - name: Build & Test
        run: |
          docker run --rm --platform "${{ matrix.platform }}" --user 0 --ulimit "memlock=${{ matrix.memlock }}:${{ matrix.memlock }}" \
            -v "${{ github.workspace }}:/src" \
            -w /src -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e LINUXCORE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e LINUXCORE_EXPECTED_POINTER_SIZE=${{ matrix.pointer_size }} \
            -e LINUXCORE_EXPECTED_TESTS=${{ steps.portable_tests.outputs.count }} \
            -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=${{ matrix.use_qemu }} \
            "${{ matrix.image }}" "${{ matrix.shell }}" -lc '
            set -eu
            ${{ matrix.setup }}
            uname -a
            libc_output=$(ldd --version 2>&1 || true)
            printf "%s\n" "$libc_output"
            printf "%s\n" "$libc_output" | grep -Eqi "${{ matrix.libc_pattern }}"

            suite_status=0
            dotnet /src/LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --report-trx --results-directory "/src/TestResults-${{ matrix.name }}" --minimum-expected-tests "$LINUXCORE_EXPECTED_TESTS" --no-banner || suite_status=$?
            if [ "${{ matrix.architecture }}" = Arm ]; then
              dotnet publish /src/LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r ${{ matrix.aot_runtime }} -p:PublishAot=true -o /tmp/aot-smoke
              /tmp/aot-smoke/LinuxCore.AotSmokeTest
            fi
            test "$suite_status" -eq 0
          '

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  publish:
    if: ${{ success() && (vars.PUBLISH == 'true' || vars.PUBLISH == 'auto' && github.ref_name == 'master') }}
    needs:
      - validate
      - validate-alpine
      - validate-emulated-architectures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Package Version
        id: package_version
        run: |
          version=$(dotnet run ./.github/workflows/PackageVersion.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack ./LinuxCore/LinuxCore.csproj -c Release --no-build -p:Version=${{ steps.package_version.outputs.version }}

      - name: Push
        run: |
          dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push **/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
