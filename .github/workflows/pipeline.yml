name: Validate & Publish
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-26.04-x64
            os: ubuntu-26.04
            architecture: x64
          - name: ubuntu-26.04-arm64
            os: ubuntu-26.04-arm
            architecture: arm64
          - name: ubuntu-24.04-x64
            os: ubuntu-24.04
            architecture: x64
          - name: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            architecture: arm64
          - name: ubuntu-22.04-x64
            os: ubuntu-22.04
            architecture: x64
          - name: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang linux-libc-dev zlib1g-dev

      - name: Build & Test
        env:
          LINUXCORE_EXPECTED_QEMU_LINUX_USER: false
          LINUXCORE_EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
          LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION: glibc
        run: |
          dotnet build
          dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true

      - name: NativeAOT Smoke
        run: |
          dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r "linux-${{ matrix.architecture }}" -p:PublishAot=true -o "artifacts/aot-smoke/${{ matrix.name }}"
          "./artifacts/aot-smoke/${{ matrix.name }}/LinuxCore.AotSmokeTest"

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-containerized-architectures:
    name: validate-containerized-architectures (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-musl
            os: ubuntu-latest
            platform: linux/amd64
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: x64
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-x64
          - name: arm64-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: arm64
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-arm64
          - name: arm32-glibc
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-resolute
            architecture: arm
            libc-implementation: glibc
            setup: apt-get update && apt-get install -y --no-install-recommends clang gcc libc6-dev linux-libc-dev zlib1g-dev
            aot-runtime: linux-arm
          - name: arm32-musl
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            image: mcr.microsoft.com/dotnet/sdk:10.0-alpine
            architecture: arm
            libc-implementation: musl
            setup: apk add --no-cache build-base clang linux-headers zlib-dev
            aot-runtime: linux-musl-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Build & Test
        run: |
          docker run --rm --platform "${{ matrix.platform }}" \
            -v "${{ github.workspace }}:/src" -w /src \
            -e LINUXCORE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=false \
            -e LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION=${{ matrix.libc-implementation }} \
            "${{ matrix.image }}" /bin/sh -lc '
            set -eu
            ${{ matrix.setup }}

            dotnet build
            dotnet test --no-build --logger trx --results-directory "TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true
            dotnet publish ./LinuxCore.AotSmokeTest/LinuxCore.AotSmokeTest.csproj -c Release -r ${{ matrix.aot-runtime }} -p:PublishAot=true -o /tmp/aot-smoke
            /tmp/aot-smoke/LinuxCore.AotSmokeTest
          '

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-emulated-architectures:
    name: validate-emulated-architectures (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ppc64le-glibc
            image: registry.access.redhat.com/dotnet/sdk:10.0
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: ppc64le
            setup: microdnf install -y binutils gcc glibc-devel kernel-headers
          - name: s390x-glibc
            image: registry.access.redhat.com/dotnet/sdk:10.0
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: s390x
            setup: microdnf install -y binutils gcc glibc-devel kernel-headers
          - name: riscv64-glibc
            image: debian:stable-slim
            binfmt-image: docker.io/tonistiigi/binfmt:latest
            architecture: riscv64
            sdk-repository: filipnavara/dotnet-riscv
            sdk-asset-architecture: riscv64
            setup: /bin/bash /src/.github/workflows/install-community-dotnet.sh /src/artifacts/community-dotnet/riscv64-glibc.tar.gz
          - name: loongarch64-glibc
            image: ghcr.io/loong64/debian:trixie-slim
            binfmt-image: ghcr.io/loong64/tonistiigi/binfmt:master
            architecture: loong64
            sdk-repository: loongson/dotnet
            sdk-asset-architecture: loongarch64
            setup: /bin/bash /src/.github/workflows/install-community-dotnet.sh /src/artifacts/community-dotnet/loongarch64-glibc.tar.gz
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build and discover portable tests on host
        id: portable_tests
        run: |
          set -euo pipefail
          dotnet build LinuxCore.Tests/LinuxCore.Tests.csproj -p:BuildPortableMtpRunner=true
          discovery_output=$(dotnet LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --list-tests --no-banner --no-ansi --progress off)
          printf '%s\n' "$discovery_output"
          if [[ "$discovery_output" =~ Test\ discovery\ summary:\ found\ ([1-9][0-9]*)\ test\(s\) ]]; then
            printf 'count=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi

      - name: Download community .NET SDK
        if: ${{ matrix.sdk-repository != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SDK_REPOSITORY: ${{ matrix.sdk-repository }}
          SDK_ASSET_ARCHITECTURE: ${{ matrix.sdk-asset-architecture }}
          SDK_ARCHIVE: ${{ github.workspace }}/artifacts/community-dotnet/${{ matrix.name }}.tar.gz
        run: dotnet run ./.github/workflows/DownloadCommunityDotNet.cs -- "$SDK_REPOSITORY" "$SDK_ASSET_ARCHITECTURE" "$SDK_ARCHIVE"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: ${{ matrix.binfmt-image }}
          platforms: ${{ matrix.architecture }}

      - name: Build & Test
        run: |
          docker run --rm --platform "linux/${{ matrix.architecture }}" --user 0 \
            -v "${{ github.workspace }}:/src" -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 \
            -e LINUXCORE_EXPECTED_ARCHITECTURE=${{ matrix.architecture }} \
            -e LINUXCORE_EXPECTED_QEMU_LINUX_USER=true \
            -e LINUXCORE_EXPECTED_LIBC_IMPLEMENTATION=glibc \
            "${{ matrix.image }}" /bin/bash -lc '
            set -eu
            ${{ matrix.setup }}

            elf_data=$(LC_ALL=C readelf -h /bin/bash | grep "^  Data:")
            case "$elf_data" in
              *"big endian"*)
                # The MTP 2.3.3 streaming TRX reader assumes native endianness and emits empty reports on big-endian targets.
                dotnet test /src/LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --logger trx --results-directory "/src/TestResults-${{ matrix.name }}" -- RunConfiguration.TreatNoTestsAsError=true
                ;;
              *"little endian"*)
                dotnet /src/LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --report-trx --results-directory "/src/TestResults-${{ matrix.name }}" --no-banner
                ;;
              *)
                printf "Unsupported ELF data encoding: %s\n" "$elf_data" >&2
                exit 1
                ;;
            esac
          '

      - name: Validate Test Results
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "TestResults-${{ matrix.name }}" -Filter *.trx)
          if ($files.Count -ne 1) { throw "Expected exactly one TRX, found $($files.Count)" }

          [xml]$trx = Get-Content $files[0] -Raw
          $actual = [int]$trx.TestRun.ResultSummary.Counters.total
          $expected = ${{ steps.portable_tests.outputs.count }}
          if ($actual -ne $expected) { throw "Expected $expected tests, TRX reported $actual" }

      - name: Upload Test Results
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.name }}
          path: TestResults-${{ matrix.name }}
        if: ${{ always() }}

  validate-full-system-emulation-s390x:
    name: validate-full-system-emulation-s390x (experimental)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        timeout-minutes: 5
        with:
          dotnet-version: 10.0.111
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Install full-system emulation prerequisites
        timeout-minutes: 10
        run: |
          set -euo pipefail
          mkdir -p "TestResults-s390x-full-system"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-s390x qemu-utils cloud-image-utils openssh-client
          command -v qemu-system-s390x qemu-img cloud-localds ssh scp systemctl systemd-run
          dotnet --info > "TestResults-s390x-full-system/host-dotnet-info.log"
          qemu-system-s390x --version > "TestResults-s390x-full-system/qemu-version.log"
          dpkg-query --show qemu-system-s390x qemu-utils cloud-image-utils openssh-client > "TestResults-s390x-full-system/host-packages.log"

      - name: Validate VM lifecycle controls
        timeout-minutes: 5
        run: ./.github/workflows/run-s390x-full-system.sh self-test

      - name: Build and discover portable tests on host
        id: full_system_portable_tests
        timeout-minutes: 10
        run: |
          set -euo pipefail
          dotnet build LinuxCore.Tests/LinuxCore.Tests.csproj -p:BuildPortableMtpRunner=true
          discovery_output=$(dotnet LinuxCore.Tests/bin/Debug/net10.0/LinuxCore.Tests.dll --list-tests --no-banner --no-ansi --progress off)
          printf '%s\n' "$discovery_output"
          if [[ "$discovery_output" =~ Test\ discovery\ summary:\ found\ ([1-9][0-9]*)\ test\(s\) ]]; then
            printf 'count=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
          tar -C LinuxCore.Tests/bin/Debug/net10.0 -czf "$RUNNER_TEMP/LinuxCore.Tests-s390x-portable.tar.gz" .

      - name: Restore Fedora s390x cloud image
        id: fedora_s390x_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 10
        with:
          path: ${{ runner.temp }}/linuxcore-s390x-image/Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2
          key: fedora-cloud-44-s390x-Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2-31a98e71c786f1355ffafdd54a11023ad5675b26f651266ca03b5951e9f03e45

      - name: Download and verify Fedora s390x cloud image
        timeout-minutes: 15
        env:
          FEDORA_IMAGE: ${{ runner.temp }}/linuxcore-s390x-image/Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2
          FEDORA_IMAGE_SHA256: 31a98e71c786f1355ffafdd54a11023ad5675b26f651266ca03b5951e9f03e45
          FEDORA_IMAGE_URL: https://download.fedoraproject.org/pub/fedora-secondary/releases/44/Cloud/s390x/images/Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$FEDORA_IMAGE")"
          if [[ -f "$FEDORA_IMAGE" ]] && ! printf '%s  %s\n' "$FEDORA_IMAGE_SHA256" "$FEDORA_IMAGE" | sha256sum --check --status; then
            rm -f "$FEDORA_IMAGE"
          fi
          if [[ ! -f "$FEDORA_IMAGE" ]]; then
            temporary_image="${FEDORA_IMAGE}.tmp.$$"
            trap 'rm -f "$temporary_image"' EXIT
            curl --fail --location --retry 5 --output "$temporary_image" "$FEDORA_IMAGE_URL"
            printf '%s  %s\n' "$FEDORA_IMAGE_SHA256" "$temporary_image" | sha256sum --check
            mv -f "$temporary_image" "$FEDORA_IMAGE"
          fi
          printf '%s  %s\n' "$FEDORA_IMAGE_SHA256" "$FEDORA_IMAGE" | sha256sum --check

      - name: Save Fedora s390x cloud image
        if: ${{ steps.fedora_s390x_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        timeout-minutes: 10
        with:
          path: ${{ runner.temp }}/linuxcore-s390x-image/Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2
          key: fedora-cloud-44-s390x-Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2-31a98e71c786f1355ffafdd54a11023ad5675b26f651266ca03b5951e9f03e45

      - name: Boot s390x VM and run tests
        timeout-minutes: 85
        env:
          S390X_ARTIFACT_DIRECTORY: ${{ github.workspace }}/TestResults-s390x-full-system
          S390X_IMAGE: ${{ runner.temp }}/linuxcore-s390x-image/Fedora-Cloud-Base-Generic-44-1.7.s390x.qcow2
          S390X_QEMU_EXECUTABLE: /usr/bin/qemu-system-s390x
          S390X_RUNNER_ARCHIVE: ${{ runner.temp }}/LinuxCore.Tests-s390x-portable.tar.gz
          S390X_STATE_DIRECTORY: ${{ runner.temp }}/linuxcore-s390x-state
          S390X_UNIT_NAME: linuxcore-s390x-${{ github.run_id }}-${{ github.run_attempt }}.service
        run: ./.github/workflows/run-s390x-full-system.sh run

      - name: Stop s390x VM
        if: ${{ always() }}
        timeout-minutes: 5
        env:
          S390X_ARTIFACT_DIRECTORY: ${{ github.workspace }}/TestResults-s390x-full-system
          S390X_STATE_DIRECTORY: ${{ runner.temp }}/linuxcore-s390x-state
          S390X_UNIT_NAME: linuxcore-s390x-${{ github.run_id }}-${{ github.run_attempt }}.service
        run: ./.github/workflows/run-s390x-full-system.sh cleanup

      - name: Validate s390x full-system test results
        if: ${{ always() }}
        timeout-minutes: 5
        shell: pwsh
        env:
          EXPECTED_TEST_COUNT: ${{ steps.full_system_portable_tests.outputs.count }}
        run: |
          $ErrorActionPreference = "Stop"
          $results = "TestResults-s390x-full-system"
          if ((Get-Content "$results/helper.status" -Raw).Trim() -ne "success") { throw "VM helper did not complete successfully" }
          if ((Get-Content "$results/cleanup.status" -Raw).Trim() -ne "success") { throw "VM cleanup did not complete successfully" }
          if ((Get-Content "$results/test.exitcode" -Raw).Trim() -ne "0") { throw "Guest test runner returned a nonzero exit code" }

          $output = Get-Content "$results/test-output.log" -Raw
          $pattern = '(?ms)^Test run summary: Passed![^\r\n]*\r?\n\s+total:\s+(?<total>\d+)\r?\n\s+failed:\s+(?<failed>\d+)\r?\n\s+succeeded:\s+(?<succeeded>\d+)\r?\n\s+skipped:\s+(?<skipped>\d+)'
          $matches = [regex]::Matches($output, $pattern)
          if ($matches.Count -ne 1) { throw "Expected exactly one successful test summary, found $($matches.Count)" }

          $summary = $matches[0].Groups
          $expected = [int]$env:EXPECTED_TEST_COUNT
          $total = [int]$summary['total'].Value
          $failed = [int]$summary['failed'].Value
          $succeeded = [int]$summary['succeeded'].Value
          $skipped = [int]$summary['skipped'].Value
          if ($total -ne $expected -or $succeeded -ne $expected -or $failed -ne 0 -or $skipped -ne 0) {
            throw "Expected $expected successful tests; got total=$total failed=$failed succeeded=$succeeded skipped=$skipped"
          }

      - name: Upload s390x full-system logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        timeout-minutes: 10
        with:
          name: test-results-s390x-full-system
          path: TestResults-s390x-full-system
          if-no-files-found: warn

  publish:
    if: ${{ success() && (vars.PUBLISH == 'true' || vars.PUBLISH == 'auto' && github.ref_name == 'master') }}
    needs:
      - validate
      - validate-containerized-architectures
      - validate-emulated-architectures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: latest
          dotnet-channel: '10.0'
          cache: true
          cache-dependency-path: |
            Directory.Packages.props
            **/*.csproj

      - name: Build
        run: dotnet build -c Release

      - name: Package Version
        id: package_version
        run: |
          version=$(dotnet run ./.github/workflows/PackageVersion.cs)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack ./LinuxCore/LinuxCore.csproj -c Release --no-build -p:Version=${{ steps.package_version.outputs.version }}

      - name: Push
        run: |
          dotnet nuget push **/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
          dotnet nuget push **/*.snupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }} --skip-duplicate
